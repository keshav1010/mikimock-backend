  mail:
    host: smtp.gmail.com
    port: 587
    username: 19bcs2562@gmail.com
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

notification:
  topic: notification-topic

server:
  port: 3333
  #  address: 0.0.0.0
  servlet:
    context-path: /Micki_Mock
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  health:
    redis:
      enabled: true

    db:
      enabled: true

    diskspace:
      enabled: true

    mail:
      enabled: true

    ping:
      enabled: true

jwt:
  secret: mySuperUltraSecureJwtSecretKeyForProduction2026SpringBootApplication
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

resilience4j:
  ratelimiter:
    instances:
      authRateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 1m
        timeoutDuration: 0

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

