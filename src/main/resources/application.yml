  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  aws:
    region: ap-south-1
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}


  ses:
    from-email: 19bcs2562@gmail.com
    to-support-email: keshav.for.official@gmail.com


  kafka:

    bootstrap-servers: localhost:9092

    producer:

      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:

      group-id: notification-group

      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:

        spring.json.value.default.type: MikiMock.com.MikiMock.Notification.dto.NotificationEvent

        spring.json.trusted.packages: MikiMock.com.MikiMock.Notification.dto

    listener:

      ack-mode: record

      missing-topics-fatal: false
